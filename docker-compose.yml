services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      LANGGRAPH_URL: http://langgraph-runtime:8000
    ports:
      - "8000:8000"
    depends_on:
      - langgraph-runtime

  langgraph-runtime:
    build:
      context: .
      dockerfile: services/langgraph-runtime/Dockerfile
    environment:
      MODEL_SERVICE_URL: http://model-service:8001
      RETRIEVAL_SERVICE_URL: http://retrieval-service:8002
      REDIS_URL: redis://redis:6379
    depends_on:
      - model-service
      - retrieval-service
      - redis

  model-service:
    build:
      context: .
      dockerfile: services/model-service/Dockerfile
    environment:
      NLI_BACKEND: transformers
      NLI_MODEL: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
      FUSION_MODEL_PATH: /artifacts/fusion_trust_model.pkl
      CONFORMAL_CALIBRATION_PATH: /artifacts/trust_calibration.pkl
      SEP_PROBE_PATH: /artifacts/sep_model.pt
    ports:
      - "8001:8001"

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
    ports:
      - "8002:8002"
    depends_on:
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
