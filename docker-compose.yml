services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truthlayer
      POSTGRES_PASSWORD: truthlayer
      POSTGRES_DB: truthlayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  verification-engine:
    build:
      context: .
      dockerfile: services/verification-engine/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      NLI_BACKEND: transformers
      NLI_MODEL: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
      EMBEDDING_MODEL: BAAI/bge-large-en-v1.5
      FUSION_MODEL_PATH: /artifacts/fusion/synthetic-logistic-v1.json
      CONFORMAL_CALIBRATION_PATH: /artifacts/conformal/synthetic-90-v1.json
      SEP_PROBE_PATH: /artifacts/sep/synthetic-linear-probe-v1.json
      GENERATION_MODEL: Qwen/Qwen2.5-3B-Instruct
      MODEL_PROFILE: laptop
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
